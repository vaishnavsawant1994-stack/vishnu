name: PWA mobile visual preview

on:
  push:
    branches:
      - main
      - 'ui/**'
      - 'feature/**'
    paths:
      - 'pwa/**'
      - 'server/owner_engineering_api.py'
      - 'server/owner_engineering_ui.py'
      - 'server/owner_release_api.py'
      - 'server/owner_release_ui.py'
      - 'future_intelligence/release_control/runtime.py'
      - 'tests/genesis_welcome_browser.mjs'
      - 'tests/pwa_mobile_preview.mjs'
      - 'tests/p2_01_home_browser.mjs'
      - 'tests/p202_personal_chat_browser.mjs'
      - 'tests/p202b_work_conversation_browser.mjs'
      - 'server/conversation_voice_api.py'
      - 'server/pwa_conversations.py'
      - 'server/projects_api.py'
      - 'server/workspace_conversation_api.py'
      - 'server/global_search_api.py'
      - 'server/notifications_center_api.py'
      - 'server/command_center_api.py'
      - 'tests/pwa_mobile_preview_runner.mjs'
      - 'tests/standalone_pwa_responsive.mjs'
      - 'tests/engineering_ui/**'
      - 'tests/owner_release_ui_browser.mjs'
      - 'tests/projects_workspace_browser.mjs'
      - 'tests/p202d_workspace_conversation_browser.mjs'
      - 'tests/p203_today_browser.mjs'
      - 'tests/p204_live_voice_browser.mjs'
      - 'tests/p205_history_browser.mjs'
      - 'tests/p206_global_search_browser.mjs'
      - 'tests/p207_notifications_browser.mjs'
      - 'tests/p208_command_center_browser.mjs'
      - 'tests/vishnu_os_workspaces_browser.mjs'
      - 'tests/projects_canonical_work_browser.mjs'
      - 'tests/projects_canonical_visualizations_browser.mjs'
      - 'tests/global_work_awareness_browser.mjs'
      - 'tests/project_autonomy_ui_browser.mjs'
      - 'tests/workorder_detail_browser.mjs'
      - 'tests/work_attention_center_browser.mjs'
      - 'tests/chat_experience_browser.mjs'
      - 'tests/adaptive_composer_browser.mjs'
      - 'tests/agent_workforce_browser.mjs'
      - 'tests/our_products_browser.mjs'
      - 'tests/visualize_workspace_browser.mjs'
      - 'tests/visualize_workspace_browser_runner.mjs'
      - 'personal-ai/pwa/**'
      - '.github/workflows/pwa-mobile-preview.yml'
  pull_request:
    paths:
      - 'pwa/**'
      - 'server/owner_engineering_api.py'
      - 'server/owner_engineering_ui.py'
      - 'server/owner_release_api.py'
      - 'server/owner_release_ui.py'
      - 'future_intelligence/release_control/runtime.py'
      - 'tests/pwa_mobile_preview.mjs'
      - 'tests/p2_01_home_browser.mjs'
      - 'tests/p202_personal_chat_browser.mjs'
      - 'tests/p202b_work_conversation_browser.mjs'
      - 'tests/p202d_workspace_conversation_browser.mjs'
      - 'tests/p203_today_browser.mjs'
      - 'tests/p204_live_voice_browser.mjs'
      - 'tests/p205_history_browser.mjs'
      - 'tests/p206_global_search_browser.mjs'
      - 'tests/p207_notifications_browser.mjs'
      - 'tests/p208_command_center_browser.mjs'
      - 'server/conversation_voice_api.py'
      - 'server/pwa_conversations.py'
      - 'server/projects_api.py'
      - 'server/workspace_conversation_api.py'
      - 'server/global_search_api.py'
      - 'server/notifications_center_api.py'
      - 'server/command_center_api.py'
      - 'tests/pwa_mobile_preview_runner.mjs'
      - 'tests/standalone_pwa_responsive.mjs'
      - 'tests/engineering_ui/**'
      - 'tests/owner_release_ui_browser.mjs'
      - 'tests/projects_workspace_browser.mjs'
      - 'tests/vishnu_os_workspaces_browser.mjs'
      - 'tests/projects_canonical_work_browser.mjs'
      - 'tests/projects_canonical_visualizations_browser.mjs'
      - 'tests/global_work_awareness_browser.mjs'
      - 'tests/project_autonomy_ui_browser.mjs'
      - 'tests/workorder_detail_browser.mjs'
      - 'tests/work_attention_center_browser.mjs'
      - 'tests/chat_experience_browser.mjs'
      - 'tests/adaptive_composer_browser.mjs'
      - 'tests/agent_workforce_browser.mjs'
      - 'tests/our_products_browser.mjs'
      - 'tests/visualize_workspace_browser.mjs'
      - 'tests/visualize_workspace_browser_runner.mjs'
      - 'personal-ai/pwa/**'
      - '.github/workflows/pwa-mobile-preview.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Serve and qualify the PWA at its deployed /iphone/ route
        run: |
          mkdir -p /tmp/pwa-preview
          cp -R pwa /tmp/pwa-preview/iphone
          mkdir -p /tmp/pwa-preview/standalone
          cp personal-ai/pwa/index.html /tmp/pwa-preview/standalone/index.html
          python3 -m http.server 4173 --bind 0.0.0.0 --directory /tmp/pwa-preview >/tmp/pwa-preview-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/iphone/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/iphone/ >/dev/null
          curl --fail --silent http://127.0.0.1:4173/standalone/ >/dev/null
          node --check pwa/p202-personal-chat.js
          node tests/p202_personal_chat_browser.mjs
          node --check pwa/p202b-work-conversation.js
          node tests/p202b_work_conversation_browser.mjs
          node --check pwa/p202d-workspace-conversation.js
          P202D_SCREENSHOT_DIR=artifacts/workspace-conversation node tests/p202d_workspace_conversation_browser.mjs
          node --check pwa/p203-today.js
          P203_SCREENSHOT_DIR=artifacts/today-p203 node tests/p203_today_browser.mjs
          node --check pwa/p204-live-voice.js
          P204_SCREENSHOT_DIR=artifacts/live-voice-p204 node tests/p204_live_voice_browser.mjs
          node --check pwa/p205-conversation-history.js
          P205_SCREENSHOT_DIR=artifacts/conversation-history-p205 node tests/p205_history_browser.mjs
          node --check pwa/global-search.js
          P206_SCREENSHOT_DIR=artifacts/global-search-p206 node tests/p206_global_search_browser.mjs
          node --check pwa/p207-notifications.js
          P207_SCREENSHOT_DIR=artifacts/notifications-p207 node tests/p207_notifications_browser.mjs
          node --check pwa/command-center.js
          P208_SCREENSHOT_DIR=artifacts/command-center-p208 node tests/p208_command_center_browser.mjs
          node tests/chat_experience_browser.mjs
          mkdir -p artifacts/project-workspace
          mkdir -p artifacts/agent-workforce
          mkdir -p artifacts/our-products
          mkdir -p artifacts/visualize
          mkdir -p artifacts/engineering-ui
          mkdir -p artifacts/owner-release-ui
          node --check pwa/genesis-neural-sphere.js
          node --check pwa/first-run.js
          node --check tests/genesis_welcome_browser.mjs
          node tests/pwa_mobile_preview_runner.mjs
          node tests/vishnu_home_responsive.mjs
          node tests/p2_01_home_browser.mjs
          VISHNU_WELCOME_SCREENSHOTS=artifacts/genesis-welcome node tests/genesis_welcome_browser.mjs
          PROJECT_SCREENSHOT_DIR=artifacts/project-workspace node tests/projects_workspace_browser.mjs
          node tests/projects_canonical_work_browser.mjs
          node tests/projects_canonical_visualizations_browser.mjs
          node tests/global_work_awareness_browser.mjs
          node tests/project_autonomy_ui_browser.mjs
          node tests/workorder_detail_browser.mjs
          node tests/work_attention_center_browser.mjs
          node tests/adaptive_composer_browser.mjs
          AGENT_WORKFORCE_SCREENSHOT_DIR=artifacts/agent-workforce node tests/agent_workforce_browser.mjs
          OUR_PRODUCTS_SCREENSHOT_DIR=artifacts/our-products node tests/our_products_browser.mjs
          VISUALIZE_SCREENSHOT_DIR=artifacts/visualize node tests/visualize_workspace_browser_runner.mjs
          VISHNU_OS_SCREENSHOT_DIR=artifacts/vishnu-os node tests/vishnu_os_workspaces_browser.mjs
          node tests/standalone_pwa_responsive.mjs
          ENGINEERING_UI_SCREENSHOT_DIR=artifacts/engineering-ui node tests/engineering_ui/cross_browser_qualification.mjs
          node tests/engineering_ui/breakpoint_network_qualification.mjs
          node tests/engineering_ui/accessibility_qualification.mjs
          node tests/engineering_ui/state_content_qualification.mjs
          node tests/engineering_ui/mobile_keyboard_safe_area_qualification.mjs
          node tests/engineering_ui/theme_motion_qualification.mjs
          node tests/engineering_ui/performance_3d_qualification.mjs
          OWNER_RELEASE_UI_SCREENSHOT_DIR=artifacts/owner-release-ui node tests/owner_release_ui_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-ai-mobile-preview
          path: artifacts/**/*.png
          if-no-files-found: warn
          retention-days: 7
