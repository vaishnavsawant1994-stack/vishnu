name: Android Instrumentation
on:
  pull_request:
    paths:
      - "android-companion/**"
      - "sensorium/native_lab.py"
      - "scripts/native_device_probe.py"
      - "tests/test_sensorium_native_*"
      - ".github/workflows/android-instrumentation.yml"
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android-companion
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            gradle connectedDebugAndroidTest --stacktrace --info
            cd ..
            python scripts/native_device_probe.py android --output native-evidence/android-emulator.json
      - name: Validate Android Sensorium evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('native-evidence/android-emulator.json').read_text())
          assert data['provider'] == 'android_emulator'
          assert data['platform'] == 'android'
          assert data['status'] == 'ready'
          assert data['physical_device'] is False
          assert data['execution_authority'] is False
          assert data['metadata']['qemu'] is True
          PY
      - name: Upload Android Sensorium evidence
        uses: actions/upload-artifact@v4
        with:
          name: sensorium-native-android-emulator
          path: native-evidence/android-emulator.json
          if-no-files-found: error
      - name: Capture emulator diagnostics on failure
        if: failure()
        timeout-minutes: 1
        run: |
          mkdir -p android-diagnostics
          timeout 5s adb devices -l > android-diagnostics/adb-devices.txt 2>&1 || true
          timeout 10s adb logcat -d > android-diagnostics/logcat.txt 2>&1 || true
          cp -R android-companion/app/build/reports/androidTests android-diagnostics/reports 2>/dev/null || true
      - name: Upload emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: android-diagnostics
          if-no-files-found: ignore
