name: Vishnu Home responsive browser checks

on:
  push:
    branches: [feature/projects-workspace-20261005]
    paths:
      - "pwa/**"
      - "tests/vishnu_home_responsive.mjs"
      - ".github/workflows/vishnu-home-responsive.yml"
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve the existing PWA assets
        run: |
          mkdir -p /tmp/vishnu-preview/iphone artifacts
          cp -a pwa/. /tmp/vishnu-preview/iphone/
          nohup python3 -m http.server 4173 --directory /tmp/vishnu-preview >/tmp/vishnu-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/iphone/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vishnu-http.log
          exit 1
      - name: Verify Home and system-wide chat at phone, tablet, and desktop widths
        run: node tests/vishnu_home_responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vishnu-home-responsive-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
