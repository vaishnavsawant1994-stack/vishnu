name: Vishnu P1-08 Recovery Verification Visual and Security Qualification
on:
  pull_request:
    paths:
      - 'pwa/genesis-verification.js'
      - 'pwa/genesis-verification.css'
      - 'pwa/first-run.js'
      - 'pwa/genesis.css'
      - 'tests/genesis_verification_browser.mjs'
      - 'tests/genesis_recovery_options_browser.mjs'
      - '.github/workflows/vishnu-p1-08-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify 3D reference layout, real code parsing and guarded backup restore
        run: |
          node --check pwa/first-run.js
          node --check pwa/genesis-verification.js
          node --check tests/genesis_verification_browser.mjs
          VISHNU_VERIFICATION_SCREENSHOTS=artifacts/genesis-verification node tests/genesis_verification_browser.mjs
      - name: Upload real screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vishnu-p1-08-actual-desktop-mobile
          path: artifacts/genesis-verification/*.png
          retention-days: 14
          if-no-files-found: warn
