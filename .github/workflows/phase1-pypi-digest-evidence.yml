name: Phase 1 PyPI digest evidence
on:
  push:
    branches:
      - 'fix/phase1-secure-dependencies-20261021'
    paths:
      - '.github/workflows/phase1-pypi-digest-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pypi-digests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve version-specific PyPI file hashes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          names = [('certifi','2026.10.19'),('Pillow','13.0.0')]
          for name, version in names:
              url=f'https://pypi.org/pypi/{name}/{version}/json'
              with urllib.request.urlopen(url,timeout=20) as response:
                  obj=json.load(response)
              files=[{'filename':u['filename'],'sha256':u['digests']['sha256'],'requires_python':u.get('requires_python'),'yanked':u.get('yanked')} for u in obj['urls']]
              assert files and not obj['info']['yanked'], f'{name}: unavailable or yanked'
              print('VISHNU_PYPI_BEGIN'+json.dumps({'name':name.lower(),'version':version,'files':files},sort_keys=True)+'VISHNU_PYPI_END')
          PY
