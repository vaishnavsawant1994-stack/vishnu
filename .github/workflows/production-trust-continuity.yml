name: Production Trust & Continuity Qualification

on:
  pull_request:
    paths:
      - "trust_continuity/**"
      - "server/trust_continuity_api.py"
      - "tests/test_production_trust_continuity.py"
      - "docs/PRODUCTION_TRUST_UNIVERSAL_CONTINUITY.md"
      - ".github/workflows/production-trust-continuity.yml"
  push:
    branches: [main]
    paths:
      - "trust_continuity/**"
      - "server/trust_continuity_api.py"
      - "tests/test_production_trust_continuity.py"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked runtime and qualification tools
        run: |
          python scripts/install_locked_requirements.py runtime
          python scripts/install_locked_requirements.py tools
          pip check

      - name: Compile production trust and continuity
        run: |
          python -m compileall -q trust_continuity server/trust_continuity_api.py

      - name: Lint production trust and continuity
        run: |
          ruff check trust_continuity server/trust_continuity_api.py tests/test_production_trust_continuity.py

      - name: Run production trust qualification tests
        run: |
          pytest -q tests/test_production_trust_continuity.py

      - name: Verify fail-closed exact-head readiness semantics
        env:
          QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          from trust_continuity.runtime import build_trust_continuity_runtime

          sha = os.environ["QUALIFIED_SHA"]
          with tempfile.TemporaryDirectory() as tmp:
              runtime = build_trust_continuity_runtime(
                  data_dir=Path(tmp),
                  commit_sha=sha,
                  is_trusted_device=lambda _device: True,
              )
              runtime.readiness.declare_software_check("campaign_tests", True)
              status = runtime.status()
              assert status["readiness"]["commit_sha"] == sha
              assert status["readiness"]["software_ready"] is True
              assert status["readiness"]["production_ready"] is False
              assert all(value == "pending" for value in status["l4"].values())
              assert status["execution_authority"] is False
          PY
