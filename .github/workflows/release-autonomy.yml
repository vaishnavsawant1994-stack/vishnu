name: Governed Release Authority

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compile release authority surfaces
        run: python -m compileall -q future_intelligence/release_control server/owner_release_api.py server/owner_release_ui.py server/cloud_app.py
      - name: Governed release control qualification
        run: >-
          pytest -q
          tests/test_release_control.py
          tests/test_release_policy_hardening.py
          tests/test_release_control_render.py
          tests/test_release_control_vercel.py
          tests/test_release_provider_telemetry.py
          tests/test_release_runtime.py
          tests/test_release_recovery.py
          tests/test_release_monitoring.py
          tests/test_release_feedback.py
          tests/test_release_automation.py
          tests/test_owner_release_api.py
      - name: Release authority invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          controller = Path('future_intelligence/release_control/controller.py').read_text()
          policy = Path('future_intelligence/release_control/policy.py').read_text()
          telemetry = Path('future_intelligence/release_control/telemetry.py').read_text()
          render = Path('future_intelligence/release_control/render_provider.py').read_text()
          vercel = Path('future_intelligence/release_control/vercel_provider.py').read_text()
          recovery = Path('future_intelligence/release_control/recovery.py').read_text()
          monitor = Path('future_intelligence/release_control/monitoring.py').read_text()
          feedback = Path('future_intelligence/release_control/feedback.py').read_text()
          automation = Path('future_intelligence/release_control/automation.py').read_text()
          handoff = Path('future_intelligence/release_control/handoff.py').read_text()
          cloud = Path('server/cloud_app.py').read_text()
          api = Path('server/owner_release_api.py').read_text()
          assert 'candidate_revision' in controller
          assert 'provider returned a deployment for a different revision' in controller
          assert 'automatic production is permanently limited to low-risk releases' in policy
          assert 'sensitive release surfaces always require owner approval' in policy
          assert 'raw_logs_persisted' in telemetry and 'False' in telemetry
          assert '/metrics/http-requests' in render
          assert '/metrics/http-latency' in render
          assert 'aggregateBy' in render and 'statusCode' in render
          assert '/runtime-logs' in vercel
          assert 'responseStatusCode' in vercel
          assert 'raw_logs_persisted' in vercel
          assert 'auto-deploy must be disabled' in render
          assert 'autoAssignCustomDomains' in vercel
          assert '"target": "production"' in vercel
          assert 'staged_production' in vercel
          assert 'promotion_rebuilds' in vercel and 'False' in vercel
          assert 'RECOVERY_REQUIRED' in recovery
          assert 'automatic replay is prohibited' in recovery
          assert 'ProductionReleaseMonitor' in monitor
          assert 'production_provider_telemetry' in monitor
          assert 'application_regression_proven' in monitor
          assert 'automatic_rollback_authority' in monitor
          assert 'observe_regression' in monitor
          assert 'ProductionRegression' in feedback
          assert 'regression_bridge.create' in feedback
          assert 'allows_automatic_production' in automation
          assert 'engineering.release_handoff' in handoff
          assert 'release_monitor_worker' in cloud
          assert 'release_plan_creation_from_api' in api
          assert 'automatic_rollback' in api
          assert 'body_activation' in api
          PY
