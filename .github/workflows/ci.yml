name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m compileall -q app agent automation browser capabilities continuity core dashboard desktop devices evidence evolution future_intelligence identity integrations knowledge memory models proactive products qualification security server tools training ui updates vision voice visual_intelligence
      - name: Our Products productization qualification gate
        run: |
          node --check pwa/our-products.js
          node --check pwa/our-products-build-lifecycle.js
          node --check pwa/our-products-distribution.js
          node --check pwa/our-products-composer.js
          node --check pwa/our-products-entry.js
          node --check tests/our_products_browser.mjs
          python -m py_compile packaging/product_platform_runner.py packaging/product_desktop_container_runner.py packaging/product_apple_runner.py packaging/product_runner_worker.py packaging/product_production_preflight.py packaging/create_product_platform_job.py
          pytest -q tests/test_our_products.py tests/test_product_composer.py tests/test_product_composer_security.py tests/test_product_distribution.py tests/test_product_artifact_builders.py tests/test_product_platform_jobs.py tests/test_product_runner_leases.py tests/test_product_runner_queue_api.py tests/test_product_platform_callback_authority.py tests/test_product_native_runner_adapters.py tests/test_product_runner_worker.py tests/test_product_runner_readiness_api.py tests/test_product_production_preflight.py
      - name: Advanced Intelligence governance gate
        run: >-
          pytest -q
          tests/test_advanced_intelligence_modes.py
          tests/test_intelligence_verifier_training.py
          tests/test_intelligence_runtime_training_store.py
          tests/test_advanced_intelligence_integration.py
          tests/test_intelligence_master_switch.py
          tests/test_deliberation_owner_enable.py
          tests/test_intelligence_budget_scope.py
      - name: Self-improvement training and evolution adversarial gate
        run: >-
          pytest -q
          tests/test_self_improvement_engine.py
          tests/test_self_improvement_governance.py
          tests/test_training_runtime_controls.py
          tests/test_self_improvement_persistence_rollback.py
          tests/test_automatic_code_evolution.py
      - name: Vishnu Visualize browser syntax gate
        run: |
          node --check pwa/visualize-workspace.js
          node --check pwa/visualize-sources.js
          node --check pwa/visualize-advanced.js
          node --check tests/visualize_workspace_browser.mjs
          node --check tests/visualize_workspace_browser_runner.mjs
      - name: Vishnu Visualize qualification gate
        run: pytest -q tests/test_visual_intelligence.py tests/test_visualize_sources.py tests/test_visualize_native_maps_runtime.py tests/test_visualizations_api_advanced.py
      - name: Canonical Work consistency gate
        run: pytest -q tests/test_work_consistency_gate.py
      - name: Canonical Work scale and performance gate
        run: pytest -q tests/test_work_performance_qualification.py
      - name: Canonical Work final qualification gate
        run: >-
          pytest -q
          tests/test_work_*.py
          tests/test_domain_claim_gate.py
          tests/test_evidence_*.py
          tests/test_authoritative_completion_judge.py
          tests/test_completion_runtime_integration.py
          tests/test_project_autonomy_*.py
      - name: E5 governed evolution qualification gate
        run: pytest -q tests/test_evolution_e5.py
      - name: E6 owner-approved handoff qualification gate
        run: pytest -q tests/test_evolution_e6_handoff.py
      - name: E7 isolated code-body qualification gate
        run: pytest -q tests/test_evolution_e7_code_body.py tests/test_evolution_e7_policy.py tests/test_evolution_e7_review.py
      - name: E8 cross-host continuity qualification gate
        run: pytest -q tests/test_continuity_e8_*.py
      - name: E9 architecture convergence gate
        run: pytest -q tests/test_e9_convergence.py tests/conformance
      - name: Canonical Work release qualification gate
        run: pytest -q tests/test_work_release_qualification.py tests/test_work_final_qualification.py
      - name: Governed release and production autonomy gate
        run: >-
          pytest -q
          tests/test_release_control.py
          tests/test_release_policy_hardening.py
          tests/test_release_control_render.py
          tests/test_release_control_vercel.py
          tests/test_release_provider_telemetry.py
          tests/test_release_runtime.py
          tests/test_release_recovery.py
          tests/test_release_monitoring.py
          tests/test_owner_release_api.py
      - name: Universal Content Intelligence V1 release qualification gate
        run: pytest -q tests/test_content_intelligence_v1_release.py
      - run: pytest -q
