name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip check
      - run: python -m compileall -q app agent automation browser capabilities continuity core dashboard desktop devices evidence evolution future_intelligence identity integrations knowledge memory models proactive qualification security server tools training ui updates vision voice visual_intelligence
      - name: Advanced Intelligence governance gate
        run: >-
          pytest -q
          tests/test_intelligence_modes.py
          tests/test_adaptive_strategy.py
          tests/test_model_performance.py
          tests/test_intelligence_verifier.py
          tests/test_training_candidates.py
          tests/test_intelligence_runtime_training_store.py
          tests/test_advanced_intelligence_integration.py
      - name: Vishnu Visualize browser syntax gate
        run: |
          node --check pwa/visualize-workspace.js
          node --check pwa/visualize-sources.js
          node --check pwa/visualize-advanced.js
          node --check tests/visualize_workspace_browser.mjs
          node --check tests/visualize_workspace_browser_runner.mjs
      - name: Vishnu Visualize qualification gate
        run: pytest -q tests/test_visual_intelligence.py tests/test_visualize_sources.py tests/test_visualize_native_maps_runtime.py tests/test_visualizations_api_advanced.py
      - name: Canonical Work consistency gate
        run: pytest -q tests/test_work_consistency_gate.py
      - name: Canonical Work scale and performance gate
        run: pytest -q tests/test_work_performance_qualification.py
      - name: Canonical Work final qualification gate
        run: >-
          pytest -q
          tests/test_work_*.py
          tests/test_domain_claim_gate.py
          tests/test_evidence_*.py
          tests/test_authoritative_completion_judge.py
          tests/test_completion_runtime_integration.py
          tests/test_project_autonomy_*.py
      - name: E5 governed evolution qualification gate
        run: pytest -q tests/test_evolution_e5.py
      - name: E6 owner-approved handoff qualification gate
        run: pytest -q tests/test_evolution_e6_handoff.py
      - name: E7 isolated code-body qualification gate
        run: pytest -q tests/test_evolution_e7_code_body.py tests/test_evolution_e7_policy.py tests/test_evolution_e7_review.py
      - name: E8 cross-host continuity qualification gate
        run: pytest -q tests/test_continuity_e8_*.py
      - name: E9 architecture convergence gate
        run: pytest -q tests/test_e9_convergence.py tests/conformance
      - name: Canonical Work release qualification gate
        run: pytest -q tests/test_work_release_qualification.py tests/test_work_final_qualification.py
      - run: pytest -q