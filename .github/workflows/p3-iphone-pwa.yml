name: P3 iPhone PWA

on:
  push:
    branches:
      - qualification/p3-iphone-first-20260908
  pull_request:
    paths:
      - 'server/iphone_pwa.py'
      - 'server/cloud_app.py'
      - 'server/owner_intelligence_api.py'
      - 'server/owner_intelligence_ui.py'
      - 'server/owner_engineering_api.py'
      - 'server/owner_engineering_ui.py'
      - 'server/owner_release_api.py'
      - 'server/owner_release_ui.py'
      - 'server/self_improvement_ui.py'
      - 'pwa/**'
      - 'tests/test_p3_iphone_pwa.py'
      - 'tests/test_p3_voice_qualification.py'
      - 'tests/test_advanced_intelligence_integration.py'
      - 'tests/test_owner_engineering_controls.py'
      - 'tests/test_owner_release_api.py'
      - 'tests/test_release_control.py'
      - 'tests/test_release_policy_hardening.py'
      - 'tests/test_release_monitoring.py'
      - 'tests/test_self_improvement_*.py'
      - 'tests/test_training_*.py'
      - 'core/config.py'
      - '.env.example'
      - '.github/workflows/p3-iphone-pwa.yml'
      - 'future_intelligence/**'
      - 'qualification/**'
      - 'tests/test_work_*.py'
      - 'tests/test_domain_claim_gate.py'
      - 'tests/test_evidence_*.py'
      - 'tests/test_authoritative_completion_judge.py'
      - 'tests/test_completion_runtime_integration.py'
      - 'tests/test_project_autonomy_*.py'
      - 'tests/test_p10_*.py'
      - 'tests/p10_soak.py'
      - 'docs/P10_*.md'
      - 'docs/CAPABILITY_MATRIX.md'
      - 'docs/MISSING_PARTIAL_STUB_MATRIX.md'
      - 'docs/TEST_MATRIX.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pwa-security-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python scripts/install_locked_requirements.py runtime
      - run: pip check
      - name: Compile changed Python surfaces
        run: python -m compileall -q server core tests
      - name: iPhone PWA integration tests
        run: pytest -q tests/test_p3_iphone_pwa.py tests/test_p3_voice_qualification.py
      - name: Owner Intelligence, Engineering and Release responsive/API qualification
        run: >-
          pytest -q
          tests/test_advanced_intelligence_integration.py
          tests/test_owner_engineering_controls.py
          tests/test_owner_release_api.py
          tests/test_release_control.py
          tests/test_release_policy_hardening.py
          tests/test_release_monitoring.py
          tests/test_self_improvement_governance.py
          tests/test_training_runtime_controls.py
          tests/test_training_export_governance.py
      - name: Fail closed if insecure production default is introduced
        run: |
          python - <<'PY'
          from pathlib import Path
          config=Path('core/config.py').read_text()
          assert "iphone_pwa_allow_insecure: bool = env_bool('PERSONAL_AI_IPHONE_ALLOW_INSECURE', False, strict=True)" in config
          page=Path('pwa/index.html').read_text()
          assert 'localStorage' not in page
          assert 'sessionStorage' not in page
          assert 'OPENAI_API_KEY' not in page
          assert 'OPENROUTER_API_KEY' not in page
          router=Path('server/iphone_pwa.py').read_text()
          for requirement in ('httponly=True','secure=True',"samesite='strict'",'hmac.compare_digest'):
              assert requirement in router
          release_api=Path('server/owner_release_api.py').read_text()
          assert 'release_plan_creation_from_api' in release_api
          assert 'body_activation' in release_api
          monitor=Path('future_intelligence/release_control/monitoring.py').read_text()
          assert 'ProductionReleaseMonitor' in monitor
          assert 'observe_regression' in monitor
          PY
