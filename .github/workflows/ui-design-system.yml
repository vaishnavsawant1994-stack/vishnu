name: Product design system responsive checks

on:
  push:
    branches: [main, 'ui/**']
    paths:
      - 'web-companion/**'
      - 'tests/web_companion_responsive.mjs'
      - 'tests/web_companion_baseline_screenshots.mjs'
      - 'pwa/**'
      - 'ios-companion/**'
      - 'android-companion/**'
      - 'ui/**'
      - 'docs/ui/**'
      - '.github/workflows/ui-design-system.yml'
  pull_request:
    paths:
      - 'web-companion/**'
      - 'tests/web_companion_responsive.mjs'
      - 'tests/web_companion_baseline_screenshots.mjs'
      - 'pwa/**'
      - 'ios-companion/**'
      - 'android-companion/**'
      - 'ui/**'
      - 'docs/ui/**'
      - '.github/workflows/ui-design-system.yml'

permissions:
  contents: read

jobs:
  web-companion-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked browser dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Serve and qualify companion layouts
        run: |
          git fetch origin main
          mkdir -p /tmp/web-companion-baseline
          for file in index.html styles.css app.js; do
            git show "origin/main:web-companion/$file" > "/tmp/web-companion-baseline/$file"
          done
          python3 -m http.server 4175 --bind 0.0.0.0 --directory /tmp/web-companion-baseline >/tmp/web-companion-baseline-server.log 2>&1 &
          python3 -m http.server 4174 --bind 0.0.0.0 --directory web-companion >/tmp/web-companion-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4174/ >/dev/null
          curl --fail --silent http://127.0.0.1:4175/ >/dev/null
          node tests/web_companion_baseline_screenshots.mjs
          node tests/web_companion_responsive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-ai-design-system-web-companion
          path: artifacts/web-companion-*.png
          if-no-files-found: warn
          retention-days: 7
