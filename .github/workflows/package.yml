name: Package Validation
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/install_locked_requirements.py runtime
      - if: runner.os == 'Windows'
        run: python scripts/install_locked_requirements.py tools
      - run: python packaging/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ai-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.deb
            dist/*.msi
          if-no-files-found: error
