    .presence{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.core-stage{position:relative;width:min(72vw,820px);height:clamp(280px,48vh,540px);isolation:isolate}#neuralCanvas{width:100%;height:100%;display:block}.core-glow{position:absolute;inset:23% 31%;border-radius:48% 52% 57% 43%;filter:blur(45px);opacity:.26;background:radial-gradient(circle,var(--cyan),var(--violet) 42%,transparent 70%);animation:breathe 4.8s ease-in-out infinite;pointer-events:none;z-index:-1}@keyframes breathe{0%,100%{transform:scale(.88) rotate(-3deg);opacity:.18}50%{transform:scale(1.1) rotate(4deg);opacity:.34}}

    .composer{width:min(700px,95%);min-height:52px;border-radius:999px;border:1px solid rgba(135,170,228,.28);background:linear-gradient(180deg,rgba(17,27,44,.86),rgba(8,13,23,.9));box-shadow:0 16px 55px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.03);display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:7px 8px 7px 18px}.wave-mini{width:27px;height:25px;display:flex;align-items:center;gap:2px;color:#79c8ff}.wave-mini i{width:2px;height:8px;border-radius:2px;background:currentColor;animation:miniWave 1.2s ease-in-out infinite}.wave-mini i:nth-child(2),.wave-mini i:nth-child(6){height:15px;animation-delay:-.3s}.wave-mini i:nth-child(3),.wave-mini i:nth-child(5){height:22px;animation-delay:-.55s}.wave-mini i:nth-child(4){height:12px;animation-delay:-.7s}@keyframes miniWave{50%{transform:scaleY(.42);opacity:.5}}.composer input{min-width:0;border:0;outline:0;color:#f5f8ff;background:transparent;font-size:1rem;padding:12px 4px}.composer input::placeholder{color:#7f8ba0}
